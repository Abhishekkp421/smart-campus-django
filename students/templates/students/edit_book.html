{% extends "base.html" %}

{% block title %}Edit Book | Smart Campus{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Book</h1>
        <p>Update library book information.</p>
    </div>

    <a href="{% url 'book-list' %}" class="secondary-btn">
        Back to Library
    </a>

</div>


<div class="dashboard-section">

    <div class="section-header">
        <div>
            <h2>Book Details</h2>
            <p>Update the book information below.</p>
        </div>
    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Book Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ book.title }}"
                    required
                >
            </div>


            <div class="form-group">
                <label>Author</label>

                <input
                    type="text"
                    name="author"
                    value="{{ book.author }}"
                    required
                >
            </div>


            <div class="form-group">
                <label>ISBN</label>

                <input
                    type="text"
                    name="isbn"
                    value="{{ book.isbn }}"
                    required
                >
            </div>


            <div class="form-group">
                <label>Category</label>

                <select name="category" required>

                    <option value="Programming" {% if book.category == "Programming" %}selected{% endif %}>Programming</option>
                    <option value="Database" {% if book.category == "Database" %}selected{% endif %}>Database</option>
                    <option value="AI/ML" {% if book.category == "AI/ML" %}selected{% endif %}>AI/ML</option>
                    <option value="Networking" {% if book.category == "Networking" %}selected{% endif %}>Networking</option>
                    <option value="Mathematics" {% if book.category == "Mathematics" %}selected{% endif %}>Mathematics</option>
                    <option value="General" {% if book.category == "General" %}selected{% endif %}>General</option>
                    <option value="Other" {% if book.category == "Other" %}selected{% endif %}>Other</option>

                </select>
            </div>


            <div class="form-group">
                <label>Publisher</label>

                <input
                    type="text"
                    name="publisher"
                    value="{{ book.publisher }}"
                >
            </div>


            <div class="form-group">
                <label>Total Copies</label>

                <input
                    type="number"
                    name="total_copies"
                    min="1"
                    value="{{ book.total_copies }}"
                    required
                >
            </div>


            <div class="form-group">
                <label>Shelf Location</label>

                <input
                    type="text"
                    name="shelf_location"
                    value="{{ book.shelf_location }}"
                >
            </div>

        </div>


        <div style="text-align: right; margin-top: 25px;">

            <a href="{% url 'book-list' %}" class="secondary-btn">
                Cancel
            </a>

            <button type="submit" class="primary-btn">
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Edit Fee | Smart Campus{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Fee</h1>
        <p>Update the student fee record.</p>
    </div>

    <a href="{% url 'fee-list' %}" class="secondary-btn">Back to Fees</a>
</div>

<div class="form-card">

    <h2>Fee Details</h2>
    <p>Update the fee information below.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Student</label>
                <select name="student" required>
                    {% for student in students %}
                    <option
                        value="{{ student.id }}"
                        {% if fee.student_id == student.id %}selected{% endif %}
                    >
                        {{ student.student_id }} - {{ student.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Fee Type</label>
                <input type="text" name="fee_type" value="{{ fee.fee_type }}" required>
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" step="0.01" value="{{ fee.amount }}" required>
            </div>

            <div class="form-group">
                <label>Paid Amount</label>
                <input type="number" name="paid_amount" step="0.01" value="{{ fee.paid_amount }}" required>
            </div>

            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" value="{{ fee.due_date|date:'Y-m-d' }}" required>
            </div>

            <div class="form-group">
                <label>Payment Date</label>
                <input type="date" name="payment_date" value="{{ fee.payment_date|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="status" required>
                    <option value="Pending" {% if fee.status == "Pending" %}selected{% endif %}>Pending</option>
                    <option value="Partial" {% if fee.status == "Partial" %}selected{% endif %}>Partial</option>
                    <option value="Paid" {% if fee.status == "Paid" %}selected{% endif %}>Paid</option>
                </select>
            </div>

            <div class="form-group">
                <label>Remarks</label>
                <input type="text" name="remarks" value="{{ fee.remarks }}">
            </div>

        </div>

        <div style="text-align:right; margin-top:25px;">
            <a href="{% url 'fee-list' %}" class="secondary-btn">Cancel</a>
            <button type="submit" class="primary-btn">Save Changes</button>
        </div>

    </form>

</div>

{% endblock %}

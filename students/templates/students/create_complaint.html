{% extends 'base.html' %}

{% block title %}Raise Complaint | Smart Campus{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Raise Complaint</h1>
        <p>Submit your complaint or support request.</p>
    </div>

</div>

<div class="form-card">

    <div class="form-section">

        <h2>Complaint Details</h2>

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label for="title">
                        Complaint Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter complaint title"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >
                        <option value="">
                            Select Category
                        </option>

                        <option value="Academic">
                            Academic
                        </option>

                        <option value="Hostel">
                            Hostel
                        </option>

                        <option value="Library">
                            Library
                        </option>

                        <option value="Fees">
                            Fees
                        </option>

                        <option value="Infrastructure">
                            Infrastructure
                        </option>

                        <option value="Technical">
                            Technical
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority"
                        required
                    >

                        <option value="">
                            Select Priority
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    placeholder="Describe your complaint..."
                    required
                ></textarea>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Submit Complaint
                </button>

                <a
                    href="{% url 'student-complaints' %}"
                    class="secondary-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

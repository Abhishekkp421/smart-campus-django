{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>

        <h1>Delete Assignment</h1>

        <p>
            Confirm assignment deletion.
        </p>

    </div>

</div>


<div class="form-card">

    <div class="form-section">

        <h2>Delete Assignment?</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ assignment.title }}</strong>?
        </p>

        <p>
            Subject:
            <strong>{{ assignment.subject.code }}</strong>
        </p>


        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="danger-btn"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'faculty-assignments' %}"
                    class="secondary-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

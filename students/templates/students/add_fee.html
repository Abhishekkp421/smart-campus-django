{% extends "base.html" %}

{% block title %}Add Fee | Smart Campus{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add Fee</h1>
        <p>Create a new student fee record.</p>
    </div>

    <a href="{% url 'fee-list' %}" class="secondary-btn">Back to Fees</a>
</div>

<div class="form-card">

    <h2>Fee Details</h2>
    <p>Enter the fee information below.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Student</label>
                <select name="student" required>
                    <option value="">Select Student</option>

                    {% for student in students %}
                    <option value="{{ student.id }}">
                        {{ student.student_id }} - {{ student.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Fee Type</label>
                <input
                    type="text"
                    name="fee_type"
                    placeholder="e.g. Tuition Fee"
                    required
                >
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0"
                    placeholder="Enter amount"
                    required
                >
            </div>

            <div class="form-group">
                <label>Paid Amount</label>
                <input
                    type="number"
                    name="paid_amount"
                    step="0.01"
                    min="0"
                    value="0"
                    required
                >
            </div>

            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" required>
            </div>

            <div class="form-group">
                <label>Payment Date</label>
                <input type="date" name="payment_date">
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="status" required>
                    <option value="Pending">Pending</option>
                    <option value="Partial">Partial</option>
                    <option value="Paid">Paid</option>
                </select>
            </div>

            <div class="form-group">
                <label>Remarks</label>
                <input
                    type="text"
                    name="remarks"
                    placeholder="Optional remarks"
                >
            </div>

        </div>

        <div style="text-align:right; margin-top:25px;">
            <a href="{% url 'fee-list' %}" class="secondary-btn">Cancel</a>
            <button type="submit" class="primary-btn">Create Fee</button>
        </div>

    </form>

</div>

{% endblock %}

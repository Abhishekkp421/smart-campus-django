{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>

        <h1>Edit Assignment</h1>

        <p>
            Update your assignment details.
        </p>

    </div>

</div>


<div class="form-card">

    <div class="form-section">

        <h2>Assignment Details</h2>


        {% if error %}

            <div class="alert alert-error">
                {{ error }}
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Assignment Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        value="{{ assignment.title }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <select
                        name="subject"
                        required
                    >

                        {% for subject in subjects %}

                            <option
                                value="{{ subject.id }}"
                                {% if assignment.subject_id == subject.id %}
                                    selected
                                {% endif %}
                            >

                                {{ subject.code }}
                                -
                                {{ subject.name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Due Date
                    </label>

                    <input
                        type="date"
                        name="due_date"
                        value="{{ assignment.due_date|date:'Y-m-d' }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Maximum Marks
                    </label>

                    <input
                        type="number"
                        name="max_marks"
                        value="{{ assignment.max_marks }}"
                        min="1"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                >{{ assignment.description }}</textarea>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

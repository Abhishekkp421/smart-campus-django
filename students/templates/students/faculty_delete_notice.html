{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Delete Notice</h1>
        <p>Confirm notice deletion.</p>
    </div>

</div>


<div class="form-card">

    <div class="form-section">

        <h2>Delete Notice?</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ notice.title }}</strong>?
        </p>


        <p>
            Notice Type:
            <strong>{{ notice.notice_type }}</strong>
        </p>


        <p>
            Publish Date:
            <strong>
                {{ notice.publish_date|date:"d M Y" }}
            </strong>
        </p>


        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="danger-btn"
                >
                    Yes, Delete
                </button>


                <a
                    href="{% url 'faculty-notices' %}"
                    class="secondary-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
